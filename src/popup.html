<!DOCTYPE html>
<html>
  <head>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg-main: #0f172a;
        --glass-bg: rgba(30, 41, 59, 0.7);
        --glass-border: rgba(255, 255, 255, 0.1);
        
        --color-joined: #3b82f6; /* Blue */
        --color-returned: #10b981; /* Green */
        --color-away: #f59e0b; /* Amber */
        --color-idle: #ef4444; /* Red */
        --color-unknown: #64748b; /* Gray */
        
        --active-color: var(--color-unknown);
      }

      body { 
        width: 320px; 
        font-family: 'Inter', sans-serif; 
        margin: 0;
        padding: 16px; 
        background: var(--bg-main);
        color: #f8fafc;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      
      h3 {
        margin: 0;
        font-weight: 600;
        font-size: 18px;
        letter-spacing: -0.5px;
      }

      .glass-card {
        background: var(--glass-bg);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid var(--glass-border);
        border-radius: 12px;
        padding: 16px;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      }

      .description {
        font-size: 12px;
        color: #94a3b8;
        line-height: 1.5;
        margin-top: 4px;
        margin-bottom: 0;
      }

      /* Auth Section */
      .auth-section {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      #user-info {
        display: none;
        font-size: 13px;
        background: rgba(255,255,255,0.05);
        padding: 8px 12px;
        border-radius: 8px;
        border: 1px solid rgba(255,255,255,0.05);
      }
      
      #user-email {
        color: #38bdf8;
        font-weight: 500;
      }

      label {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        cursor: pointer;
        color: #e2e8f0;
      }
      
      input[type="checkbox"] {
        accent-color: var(--color-joined);
        width: 16px;
        height: 16px;
        cursor: pointer;
      }

      button {
        background: #f8fafc;
        color: #0f172a;
        border: none;
        padding: 10px;
        border-radius: 8px;
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
        transition: transform 0.1s, opacity 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }
      
      button:hover {
        opacity: 0.9;
        transform: translateY(-1px);
      }
      
      button:active {
        transform: translateY(0);
      }

      #status {
        margin: 0;
        font-size: 12px;
        text-align: center;
        color: #94a3b8;
        min-height: 14px;
      }

      /* Focus Mode Indicator */
      .focus-indicator {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        padding: 20px;
        position: relative;
        overflow: hidden;
        transition: all 0.3s ease;
      }
      
      .focus-indicator::before {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        background: var(--active-color);
        opacity: 0.1;
        z-index: 0;
        transition: background 0.3s ease;
      }

      .indicator-title {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: #cbd5e1;
        z-index: 1;
      }

      #currentMode {
        margin: 0;
        font-size: 24px;
        font-weight: 700;
        color: var(--active-color);
        z-index: 1;
        text-shadow: 0 0 15px rgba(var(--active-color-rgb), 0.5);
        transition: color 0.3s ease;
      }

      /* Mode specific variable overrides */
      body.mode-joined { --active-color: var(--color-joined); --active-color-rgb: 59, 130, 246; }
      body.mode-returned { --active-color: var(--color-returned); --active-color-rgb: 16, 185, 129; }
      body.mode-away { --active-color: var(--color-away); --active-color-rgb: 245, 158, 11; }
      body.mode-idle { --active-color: var(--color-idle); --active-color-rgb: 239, 68, 68; }

    </style>
  </head>
  <body>
    
    <div class="glass-card">
      <h3>Focus Tracker</h3>
      <p class="description">
        Securely logs tab switches and idle time during Google Meet classes to Firebase.
      </p>
    </div>

    <div class="glass-card focus-indicator">
      <span class="indicator-title">Current Status</span>
      <p id="currentMode">UNKNOWN</p>
    </div>

    <div class="glass-card auth-section">
      <div id="user-info">
        Signed in as:<br><strong id="user-email"></strong>
      </div>
      
      <label>
        <input type="checkbox" id="consent" />
        Enable tracking during class
      </label>
      
      <button id="auth-btn">
        <svg width="18" height="18" viewBox="0 0 48 48" style="display:inline-block;">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        Sign in with Google
      </button>
      
      <p id="status"></p>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
