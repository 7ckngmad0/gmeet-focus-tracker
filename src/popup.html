<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="popup.css" rel="stylesheet">
  </head>
  <body>

    <div class="glass-card">
      <h3>Focus Tracker</h3>
      <p class="description">
        Logs tab switches and idle time during Google Meet classes to Firebase.
      </p>
    </div>

    <!-- Screen 1: choose a role -->
    <section id="screen-role" class="screen" hidden>
      <div class="glass-card role-section">
        <span class="indicator-title">Who are you?</span>
        <button type="button" class="role-btn" id="role-student">I am a Student</button>
        <button type="button" class="role-btn secondary" id="role-professor">I am a Professor</button>
        <p class="message" id="role-message" role="alert"></p>
      </div>
    </section>

    <!-- Screen 2: student consent + sign-in -->
    <section id="screen-student-signin" class="screen" hidden>
      <div class="glass-card auth-section">
        <label>
          <input type="checkbox" id="consent" />
          Enable activity and focus tracking
        </label>
        <p class="hint">Required. Tracking only runs while you're in a Google Meet call.</p>

        <button type="button" id="student-signin-btn" class="google-btn" disabled>
          <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
          </svg>
          Sign in with Google
        </button>
        <p class="message" id="student-message" role="alert"></p>
        <button type="button" class="link-btn" data-back>Back</button>
      </div>
    </section>

    <!-- Screen 3: signed-in student -->
    <section id="screen-student" class="screen" hidden>
      <div class="glass-card focus-indicator">
        <span class="indicator-title">Current Status</span>
        <p id="currentMode">NOT IN A CALL</p>
      </div>

      <div class="glass-card auth-section">
        <div class="user-info">
          Signed in as student:<br><strong id="student-email"></strong>
        </div>
        <p class="connection" id="connection"></p>
        <button type="button" class="link-btn" id="student-signout">Sign out</button>
      </div>
    </section>

    <!-- Screen 4: signed-in professor -->
    <section id="screen-professor" class="screen" hidden>
      <div class="glass-card auth-section">
        <div class="user-info">
          Signed in as professor:<br><strong id="professor-email"></strong>
        </div>
        <button type="button" id="open-dashboard">Open Dashboard</button>
        <p class="hint" id="professor-room"></p>
        <button type="button" class="link-btn" id="professor-signout">Sign out</button>
      </div>
    </section>

    <script src="popup.js"></script>
  </body>
</html>
